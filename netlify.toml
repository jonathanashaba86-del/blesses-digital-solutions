# Blessed Digital Solutions — static deploy configuration
[build]
  publish = "."
  command = "python3 tools/build.py"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/voicecore"
  to = "/products/voicecore.html"
  status = 301

[[redirects]]
  from = "/scorecore"
  to = "/products/scorecore.html"
  status = 301

[[redirects]]
  from = "/radarcore"
  to = "/products/radarcore.html"
  status = 301

[[redirects]]
  from = "/employcore"
  to = "/products/employcore.html"
  status = 301

[[redirects]]
  from = "/products"
  to = "/products/"
  status = 301
